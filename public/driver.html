<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyRide Drive</title>
  <meta name="description" content="Drive, deliver or move goods with MyRide in Pokhara. Weekly payouts to your bank.">
  <meta name="theme-color" content="#075a52">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .steps { display: flex; gap: 4px; margin: 8px 0 14px; }
    .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
    .steps span.on { background: var(--brand); }
    .doc { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .doc label { margin: 0; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal .card { max-width: 420px; width: 100%; }
    .cats { display: flex; gap: 10px; flex-wrap: wrap; }
    .cats label { display: flex; gap: 4px; align-items: center; font-size: .9rem; color: var(--ink); margin: 4px 0; }
    .cats input { width: auto; }
  </style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="bar">
      <div><div class="logo"><span>My</span>Ride <small style="font-weight:700;color:var(--brand-dark)">Drive</small></div>
        <div class="sub">Drive · Deliver · Haul — paid weekly to your bank</div></div>
      <button class="icon-btn hidden" id="logout" title="Log out">⎋</button>
    </header>
    <section id="login"></section>
    <section id="apply" class="hidden"></section>
    <section id="home" class="hidden">
      <div class="card">
        <div class="kv"><b id="dname"></b><span id="drating"></span></div>
        <div class="muted" id="dveh"></div>
        <div id="dtype" style="margin-top:4px"></div>
      </div>
      <div class="grid" id="tiles"></div>
      <p class="muted">Tap the map to set your position (or use GPS), then go online.</p>
      <div class="row"><button class="btn ghost" id="gps">📍 Use GPS</button><button class="btn" id="onBtn">Go online</button></div>
      <button class="btn ghost" id="homeBtn" style="margin-top:8px">🏠 Heading home — only trips toward home</button>
      <label class="check"><input type="checkbox" id="autoDrive"> Demo: auto-drive along the route</label>
      <div id="offers"></div>
      <div id="active"></div>
      <h3 style="margin:18px 0 6px;font-size:1rem">This week</h3><div class="card" id="week"></div>
      <h3 style="margin:18px 0 6px;font-size:1rem">Payouts (every Sunday)</h3><div id="payouts"></div>
    </section>
  </aside>
  <main class="map-wrap"><div id="map"></div><div class="map-hint" id="hint">Offline</div></main>
</div>
<div id="modal" class="modal hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script src="common.js"></script>
<script src="face.js"></script>
<script src="driver.js"></script>
</body>
</html>
